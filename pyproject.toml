[project]
name = "creatorutils-engine"
version = "1.0.0"
description = "Local AI engine for CreatorUtils B-Roll Matcher"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.24,<3",
  "google-genai>=0.1,<2",
  "scikit-learn>=1.3,<2",
  "faster-whisper>=1.0,<2",
  "huggingface-hub>=0.27,<2",
  "legacy-cgi>=2.6; python_version >= '3.13'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
