  <!-- Hidden File Pickers for Real Videos -->
  <input type="file" id="input-aroll-file" accept="video/mp4,video/quicktime,video/webm" style="display:none;">
  <input type="file" id="input-broll-files" accept="video/mp4,video/quicktime,video/webm" multiple style="display:none;">

  <!-- Drag and Drop Fullscreen Indicator -->
  <div class="drag-drop-overlay" id="drag-drop-overlay">
    <div class="drag-drop-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <div style="font-size: 16px; font-weight: 600;">Thả file video (.mp4, .mov) vào đây</div>
      <div style="font-size: 12px; color: var(--text-muted);">Tự động nạp vào A-Roll hoặc B-Roll Gallery</div>
    </div>
  </div>

  <!-- 1. TOP BAR: macOS Window Chrome & Workflow Stage Navigation -->
  <header class="macos-titlebar">
    <div class="titlebar-left">
      <div class="traffic-lights">
        <span class="traffic-dot dot-red" title="Đóng"></span>
        <span class="traffic-dot dot-yellow" title="Thu nhỏ"></span>
        <span class="traffic-dot dot-green" title="Phóng to"></span>
      </div>
      <div class="project-meta">
        <div class="project-title" id="proj-name">Dự án mới</div>
        <div class="project-subtitle" id="proj-sub">Chưa có video · 00:00</div>
      </div>
    </div>


    <!-- 5 Workflow Progress Steps -->
    <nav class="workflow-pills" aria-label="Quy trình dựng">
      <div class="pill-step active" id="step-transcript" title="Bản ghi lời nói">
        <span class="step-indicator"></span>
        <span data-i18n="transcript">Bản ghi lời</span>
      </div>
      <div class="pill-step" id="step-cut" title="Cắt thô video">
        <span class="step-indicator"></span>
        <span data-i18n="cut">Cắt</span>
      </div>
      <div class="pill-step" id="step-segment" title="Phân đoạn nội dung">
        <span class="step-indicator"></span>
        <span data-i18n="segment">Phân đoạn</span>
      </div>
      <div class="pill-step" id="step-broll" title="Xử lý khớp B-roll">
        <span class="step-indicator"></span>
        <span data-i18n="broll">B-Roll</span>
      </div>
      <div class="pill-step" id="step-export" title="Xuất file Final Cut Pro / Premiere">
        <span class="step-indicator"></span>
        <span data-i18n="export">Xuất</span>
      </div>
    </nav>

    <div class="titlebar-right">
      <div class="project-selector-wrapper">
        <div class="project-badge-selector" id="btn-project-selector" title="Chọn hoặc đổi dự án">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span id="label-current-project">Dự án mới</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="project-dropdown-menu" id="project-dropdown-menu" style="display:none;">
          <div class="dropdown-item" id="item-new-project">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>+ Tạo dự án mới (Trống)</span>
          </div>
          <div class="dropdown-item" id="item-load-sample-review">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Tải mẫu: Review Robot Deebot (Full MP4)</span>
          </div>
        </div>
      </div>
      <button class="icon-btn-ghost" id="btn-api-key" title="Cấu hình Gemini API Key">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
  </header>
